[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.3",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "exifread>=3.0.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "google-auth[requests]>=2.29.0",
    "pgvector>=0.3.0",
    "arxiv>=2.1.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
