services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports NOT exposed — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports NOT exposed — only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    command: python scripts/seed_accounts.py
    env_file: .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    # 2 workers fits within 2 GB RAM (DO $12 plan); increase to 4 on 4 GB+ plans
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build: .
    restart: unless-stopped
    # concurrency=1 keeps worker within budget on 2 GB RAM; increase on larger plans
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=1
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
